<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
          content="Vibe-Synth — describe a sound or visual character in plain English and get a real-time DSP algorithm or GPU shader." />

    <title>Vibe-Synth</title>

    <!-- Favicon (inline SVG as data URI — no external file needed) -->
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F3864'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' font-family='Arial' fill='white'%3E%E2%9C%A7%3C/text%3E%3C/svg%3E" />

    <!-- Preconnect hints for API calls made by the TypeScript modules -->
    <link rel="preconnect" href="http://localhost:8000" />

    <!--
      NOTE: No external CSS or JS is loaded here.
      Vite injects the compiled bundle via the <script type="module"> below.
      All stylesheets are imported inside main.ts (import './styles.css').
    -->
  </head>

  <body>

    <!-- =====================================================================
         Application root
         ===================================================================== -->
    <div id="app">

      <!-- ── Header ─────────────────────────────────────────────────────── -->
      <header class="vs-header">
        <div class="vs-header-inner">
          <span class="vs-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect width="24" height="24" rx="5" fill="#1F3864"/>
              <path d="M6 16 L10 8 L12 13 L14 10 L18 16"
                    stroke="white" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
            Vibe-Synth
          </span>
          <nav class="vs-nav" aria-label="Main navigation">
            <a href="#dsp"    class="vs-nav-link">DSP</a>
            <a href="#shader" class="vs-nav-link">Shader</a>
            <a href="http://localhost:8000/docs"
               target="_blank" rel="noopener" class="vs-nav-link">API docs</a>
          </nav>
        </div>
      </header>

      <!-- ── Main layout ─────────────────────────────────────────────────── -->
      <main class="vs-main">

        <!-- Left panel: Vibe input + status -->
        <section class="vs-panel vs-panel--input" aria-label="Vibe input">
          <h1 class="vs-panel-title">Describe your Vibe</h1>
          <p class="vs-panel-subtitle">
            Natural language &rarr; compiled DSP algorithm or GPU shader, live in your browser.
          </p>

          <!-- VibeInput component mounts here -->
          <div id="vibe-input-root"></div>

          <!-- Status line (updated by AudioEngine / ShaderPreview) -->
          <p id="global-status" class="vs-global-status" aria-live="polite"></p>
        </section>

        <!-- Right panel: split into audio and visual sub-panels -->
        <section class="vs-panel vs-panel--output" aria-label="Algorithm output">

          <!-- DSP sub-panel -->
          <div id="dsp" class="vs-output-section">
            <h2 class="vs-section-title">
              <span class="vs-section-badge vs-section-badge--dsp">DSP</span>
              Audio Engine
            </h2>
            <div class="vs-audio-controls">
              <button id="btn-start" class="vs-btn vs-btn--primary" type="button">
                Start audio
              </button>
              <button id="btn-stop" class="vs-btn vs-btn--secondary" type="button"
                      disabled>
                Stop
              </button>
            </div>
            <!-- ParamPanel (DSP) mounts here -->
            <div id="param-panel-dsp"></div>
          </div>

          <hr class="vs-divider" />

          <!-- Shader sub-panel -->
          <div id="shader" class="vs-output-section">
            <h2 class="vs-section-title">
              <span class="vs-section-badge vs-section-badge--shader">Shader</span>
              Visual Preview
            </h2>
            <!-- ShaderPreview renders into this canvas -->
            <canvas id="shader-canvas" class="vs-canvas"
                    width="640" height="360"
                    aria-label="Real-time shader preview"></canvas>
            <!-- ParamPanel (shader) mounts here -->
            <div id="param-panel-shader"></div>
          </div>

        </section>

      </main>

      <!-- ── Footer ──────────────────────────────────────────────────────── -->
      <footer class="vs-footer">
        <p>
          Vibe-Synth &mdash; LLM-powered DSP &amp; shader synthesis &mdash;
          <a href="http://localhost:8000/docs" target="_blank" rel="noopener">API</a>
          &middot;
          <a href="docs/architecture.md" target="_blank" rel="noopener">Docs</a>
        </p>
      </footer>

    </div><!-- /#app -->

    <!-- =====================================================================
         Vite entry point — injects the compiled bundle in dev and production.
         All TypeScript modules are loaded via main.ts.
         ===================================================================== -->
    <script type="module" src="/src/main.ts"></script>

  </body>
</html>
