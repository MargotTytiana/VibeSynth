# =============================================================================
# File: docker-compose.yml
# Purpose: Local development and single-host production orchestration for
#          Vibe-Synth. Defines three services: the FastAPI backend, the Vite
#          frontend dev server, and an optional Ollama local LLM endpoint.
#          Run with: docker compose up --build
# =============================================================================

version: "3.9"

# ---------------------------------------------------------------------------
# Shared environment — loaded from .env at the project root.
# Copy .env.example to .env and fill in LLM_API_KEY before starting.
# ---------------------------------------------------------------------------

services:

  # --------------------------------------------------------------------------
  # backend — FastAPI + Uvicorn
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime           # use the lean runtime stage, not the builder
    image: vibe-synth-backend:dev
    container_name: vibe-synth-backend
    restart: unless-stopped

    env_file:
      - .env                    # all settings from config.py are loaded here

    environment:
      # Override any .env defaults here for the containerised context
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      CACHE_INDEX_PATH: "/data/cache/cache_index.json"
      LOG_COMPILE_CSV:  "/data/compiler/compile_log.csv"

    ports:
      - "8000:8000"             # expose FastAPI on host port 8000

    volumes:
      # Persist the cache index and compile log across container restarts
      - vibe-cache:/data/cache
      - vibe-logs:/data/compiler
      # Mount the generation/prompts directory so prompt templates can be
      # edited without rebuilding the image
      - ./generation/prompts:/app/generation/prompts:ro

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    depends_on:
      ollama:
        condition: service_started   # only relevant when LLM_PROVIDER=local

    networks:
      - vibe-net

  # --------------------------------------------------------------------------
  # frontend — Vite dev server (development only)
  # In production, build the frontend with `npm run build` and serve the
  # dist/ directory via nginx or a CDN — do not run the Vite dev server
  # in production containers.
  # --------------------------------------------------------------------------
  frontend:
    image: node:20-slim
    container_name: vibe-synth-frontend
    working_dir: /app
    restart: unless-stopped

    volumes:
      - ./frontend:/app         # mount the entire frontend directory

    command: >
      sh -c "npm install --prefer-offline && npm run dev -- --host 0.0.0.0"

    ports:
      - "5173:5173"             # Vite dev server on host port 5173

    environment:
      VITE_API_BASE_URL: "http://localhost:8000"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - vibe-net

  # --------------------------------------------------------------------------
  # ollama — local LLM inference server (optional)
  # Only needed when LLM_PROVIDER=local in your .env.
  # Comment this service out entirely if you are using OpenAI or Anthropic.
  #
  # After first start, pull a model:
  #   docker exec vibe-synth-ollama ollama pull codellama:13b
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: vibe-synth-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"           # Ollama OpenAI-compatible API on host port 11434

    volumes:
      - ollama-models:/root/.ollama  # persist downloaded model weights

    # Uncomment the deploy block if you have a compatible NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    networks:
      - vibe-net

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  vibe-cache:
    driver: local
    labels:
      description: "Vibe-Synth vector cache index (cache_index.json)"

  vibe-logs:
    driver: local
    labels:
      description: "Vibe-Synth compiler telemetry (compile_log.csv)"

  ollama-models:
    driver: local
    labels:
      description: "Ollama local LLM model weights"

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
networks:
  vibe-net:
    driver: bridge
    labels:
      description: "Internal network for Vibe-Synth services"
